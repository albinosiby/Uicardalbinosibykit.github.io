<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionCards — 30 Card Animation Styles</title>
<style>
/* ============ variables.css ============ */
:root {
  --bg: #0a0a0f;
  --bg-elevated: #13131a;
  --bg-card: #1a1a24;
  --bg-card-hover: #22222e;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);
  --text: #f5f5f7;
  --text-muted: #8a8a99;
  --text-dim: #5a5a6a;
  --accent: #6366f1;
  --accent-2: #a855f7;
  --accent-3: #ec4899;
  --success: #10b981;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --shadow-lg: 0 24px 64px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 40px rgba(99,102,241,0.3);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --mono: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', monospace;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,0.15), transparent),
    radial-gradient(ellipse 60% 50% at 80% 100%, rgba(168,85,247,0.08), transparent);
  pointer-events: none;
  z-index: 0;
}

/* ============ layout.css ============ */
.app { position: relative; z-index: 1; }

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,15,0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 32px;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid;
  place-items: center;
  font-size: 14px;
  -webkit-text-fill-color: white;
  box-shadow: var(--shadow-glow);
}

.nav {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.nav a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  transition: all 0.2s;
}

.nav a:hover { color: var(--text); background: rgba(255,255,255,0.05); }

.search-wrap {
  position: relative;
  width: 220px;
}

.search {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px 9px 36px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  transition: all 0.2s;
}

.search:focus {
  outline: none;
  border-color: var(--accent);
  background: rgba(99,102,241,0.08);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}

.search::placeholder { color: var(--text-dim); }

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
  font-size: 14px;
}

.hero {
  max-width: 1440px;
  margin: 0 auto;
  padding: 80px 32px 48px;
  text-align: center;
}

.hero h1 {
  font-size: clamp(36px, 6vw, 64px);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.05;
  margin-bottom: 20px;
  background: linear-gradient(180deg, #fff 0%, #a0a0b0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero p {
  font-size: clamp(15px, 2vw, 18px);
  color: var(--text-muted);
  max-width: 600px;
  margin: 0 auto;
}

.filters {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 32px 32px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

.filter-btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 7px 16px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
  white-space: nowrap;
}

.filter-btn:hover {
  color: var(--text);
  border-color: var(--border-strong);
  transform: translateY(-1px);
}

.filter-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent;
  color: white;
  box-shadow: 0 4px 16px rgba(99,102,241,0.4);
}

.grid {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 32px 80px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

@media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 720px) {
  .grid { grid-template-columns: 1fr; padding: 0 20px 60px; }
  .hero { padding: 48px 20px 32px; }
  .filters { padding: 0 20px 24px; }
  .header-inner { padding: 12px 20px; gap: 16px; }
  .nav { display: none; }
  .search-wrap { width: 140px; }
}

/* ============ components.css ============ */
.card-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: all 0.3s var(--ease-out);
  display: flex;
  flex-direction: column;
  animation: cardFadeIn 0.5s var(--ease-out) both;
}

@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-item:hover {
  border-color: var(--border-strong);
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.card-preview {
  height: 260px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #0e0e15, #16161f);
  display: grid;
  place-items: center;
  perspective: 1200px;
  transform-style: preserve-3d;
}

.card-meta {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.card-num {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: rgba(99,102,241,0.12);
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.05em;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.card-cats {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.cat {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
}

.card-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
  flex: 1;
}

.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

.btn {
  flex: 1;
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  transition: all 0.2s var(--ease-out);
  letter-spacing: 0.01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn:hover {
  background: rgba(255,255,255,0.08);
  border-color: var(--border-strong);
  transform: translateY(-1px);
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent;
  color: white;
}

.btn-primary:hover {
  box-shadow: 0 4px 20px rgba(99,102,241,0.4);
  filter: brightness(1.1);
}

/* ============ animation demo elements ============ */
.demo-card {
  width: 100px;
  height: 130px;
  border-radius: 10px;
  background: linear-gradient(135deg, #2a2a3e, #1e1e2e);
  border: 1px solid rgba(255,255,255,0.1);
  display: grid;
  place-items: center;
  color: var(--text-muted);
  font-size: 22px;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  will-change: transform;
  position: relative;
  overflow: hidden;
}

.demo-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(99,102,241,0.15), transparent 60%);
  pointer-events: none;
}

.demo-card.c1 { background: linear-gradient(135deg, #3b2a5e, #1e1e2e); }
.demo-card.c2 { background: linear-gradient(135deg, #2a3e5e, #1e1e2e); }
.demo-card.c3 { background: linear-gradient(135deg, #5e2a3e, #1e1e2e); }
.demo-card.c4 { background: linear-gradient(135deg, #2a5e3e, #1e1e2e); }
.demo-card.c5 { background: linear-gradient(135deg, #5e5e2a, #1e1e2e); }

/* ============ modal ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,5,10,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  transition: opacity 0.3s var(--ease-out);
}

.modal-overlay.open { display: flex; }
.modal-overlay.visible { opacity: 1; }

.modal {
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 1100px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: scale(0.94) translateY(20px);
  transition: transform 0.4s var(--ease-out);
  position: relative;
}

.modal-overlay.visible .modal { transform: scale(1) translateY(0); }

.modal::-webkit-scrollbar { width: 8px; }
.modal::-webkit-scrollbar-track { background: transparent; }
.modal::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

.modal-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.2s;
  z-index: 10;
}

.modal-close:hover { background: rgba(255,255,255,0.12); transform: rotate(90deg); }

.modal-body { padding: 40px; }
@media (max-width: 720px) { .modal-body { padding: 24px; } }

.modal-header { margin-bottom: 28px; padding-right: 40px; }

.modal-title {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}

.modal-subtitle {
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 16px;
}

.modal-preview {
  height: 420px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #0a0a12, #14141e);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  perspective: 1400px;
  transform-style: preserve-3d;
  margin-bottom: 28px;
  overflow: hidden;
  position: relative;
}

@media (max-width: 720px) { .modal-preview { height: 280px; } }

.modal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 28px;
}

@media (max-width: 720px) { .modal-grid { grid-template-columns: 1fr; } }

.info-block {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.info-block h4 {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 12px;
}

.info-block ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }

.info-block li {
  font-size: 13px;
  color: var(--text-muted);
  padding-left: 16px;
  position: relative;
  line-height: 1.5;
}

.info-block li::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--accent);
  font-size: 12px;
}

.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }

.tag-list .cat { font-size: 11px; padding: 4px 10px; }

.prompt-section {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.prompt-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.02);
}

.prompt-head h4 {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}

.prompt-body {
  padding: 20px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-muted);
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 340px;
  overflow-y: auto;
}

.prompt-body::-webkit-scrollbar { width: 6px; }
.prompt-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

.copy-btn {
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
  font-family: inherit;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.copy-btn:hover { background: rgba(255,255,255,0.1); }
.copy-btn.copied { background: var(--success); border-color: var(--success); color: white; }

.controls {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 20px;
  flex-wrap: wrap;
}

.ctrl-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 14px;
  transition: all 0.2s;
}

.ctrl-btn:hover { background: rgba(255,255,255,0.12); transform: scale(1.08); }

.hint {
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 14px;
  font-style: italic;
}

/* ============ preview animation classes ============ */
/* IMPORTANT: previews use position: relative + absolutely-positioned children
   centered via left:50%/top:50% + translate(-50%,-50%) in transform. */

.preview-coverflow,
.preview-stack,
.preview-fan,
.preview-vparallax,
.preview-flip,
.preview-expand,
.preview-depth,
.preview-flipstack,
.preview-blur,
.preview-fadeslide,
.preview-shuffle,
.preview-cprogress,
.preview-curved,
.preview-circle,
.preview-sparallax {
  position: relative;
  width: 100%;
  height: 100%;
}

.preview-flip,
.preview-depth,
.preview-expand,
.preview-blur,
.preview-fadeslide {
  display: block;
}

/* Coverflow */
.preview-coverflow { transform-style: preserve-3d; }
.preview-coverflow .cf-item {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 90px;
  height: 120px;
  margin-left: -45px;
  margin-top: -60px;
  border-radius: 10px;
  background: linear-gradient(135deg, #2a2a3e, #1e1e2e);
  border: 1px solid rgba(255,255,255,0.1);
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-muted);
  transition: all 0.7s var(--ease-out);
  will-change: transform, opacity;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

/* Stack */
.preview-stack .st-item {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 90px;
  height: 120px;
  margin-left: -45px;
  margin-top: -60px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-muted);
  transition: all 0.6s var(--ease-out);
  will-change: transform, opacity;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

/* Fan */
.preview-fan .fan-item {
  position: absolute;
  left: 50%;
  bottom: 20%;
  width: 70px;
  height: 95px;
  margin-left: -35px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-muted);
  transition: all 0.6s var(--ease-out);
  transform-origin: bottom center;
  will-change: transform;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

/* Vertical parallax */
.preview-vparallax .vp-item {
  position: absolute;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-muted);
  transition: transform 0.5s var(--ease-out);
  will-change: transform;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

/* Flip */
.preview-flip .flip-item {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 90px;
  height: 120px;
  margin-left: -45px;
  margin-top: -60px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-muted);
  backface-visibility: hidden;
  transition: all 0.7s var(--ease-in-out);
  will-change: transform, opacity;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

/* Infinite */
.preview-infinite { width: 100%; height: 100%; position: relative; overflow: hidden; }
.preview-infinite .inf-track {
  position: absolute;
  top: 50%;
  left: 0;
  display: flex;
  gap: 16px;
  transform: translateY(-50%);
  will-change: transform;
}
.preview-infinite .inf-item {
  width: 70px;
  height: 95px;
  flex-shrink: 0;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-muted);
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

/* Tilt */
.preview-tilt { width: 100%; height: 100%; display: grid; place-items: center; perspective: 800px; }
.preview-tilt .tilt-item {
  width: 110px;
  height: 150px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: 700;
  color: var(--text-muted);
  transition: transform 0.4s var(--ease-out);
  will-change: transform;
  transform-style: preserve-3d;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  position: relative;
  overflow: hidden;
}

/* Expanded center */
.preview-expand .ex-item {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 80px;
  height: 105px;
  margin-left: -40px;
  margin-top: -52px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-muted);
  transition: all 0.7s var(--ease-out);
  will-change: transform, opacity;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

/* Scroll reveal */
.preview-scroll { position: relative; width: 100%; height: 100%; }
.preview-scroll .sc-item {
  position: absolute;
  width: 65px;
  height: 85px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--text-muted);
  opacity: 0;
  transform: translateY(50px) scale(0.94);
  transition: all 0.7s var(--ease-out);
